# files: the main service is a small MCP front (mcp/front.py + mcp/tools.py, inlined by mcp/inline.py).
# It serves the Files tools at /mcp (box-only: apps on this box, e.g. the agent through the Wizard hub) and
# passes every other request unchanged to files-engine, the unmodified File Browser, so the web app is the same.
services:
  files:
    image: python:3.12-alpine@sha256:1b668429b3511ab407d8e00648891631b0b1a4d7e15e3ca70f38ab5b91ad4ab4
    user: 1000:1000
    read_only: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    pids_limit: 256
    mem_limit: 256m
    environment:
      WIZARD_APP: files
      APP_VERSION: 2.63.23-wizard2
      FRONT_PORT: '8080'
      UPSTREAM_HOST: files-engine
      UPSTREAM_PORT: '8080'
      FILES_ROOT: /srv
      PYTHONDONTWRITEBYTECODE: '1'
    depends_on:
    - files-engine
    volumes:
    - ${ROOT_FOLDER_HOST}/media:/srv
    command:
    - python
    - -c
    # BEGIN MCP FRONT (generated by mcp/inline.py)
    - |
      """Wizard MCP front: serves this app's MCP tools at /mcp and passes every other request,
      byte for byte, to the app behind it (HTTP, streaming and WebSockets alike).
      Stdlib only, so it runs on a stock python image with no build step.
      Generated from the app repo's mcp/ folder; edit there, then run mcp/inline.py."""
      import asyncio
      import contextvars
      import base64
      import json
      import os
      import socket
      import struct
      import time
      import urllib.parse
      import urllib.request
      import uuid

      APP = os.environ.get("WIZARD_APP", "app")
      VERSION = os.environ.get("APP_VERSION", "0")
      PORT = int(os.environ.get("FRONT_PORT", "8080"))
      UP_HOST = os.environ.get("UPSTREAM_HOST", "")
      UP_PORT = int(os.environ.get("UPSTREAM_PORT", str(PORT)))
      MCP_PATH = "/mcp"
      MCP_TOKEN = os.environ.get("MCP_TOKEN", "")  # when set, /mcp needs Authorization: Bearer <token>
      MAX_HEAD = 65536
      MAX_BODY = 1 << 20
      TOOLS = {}
      REQUEST = contextvars.ContextVar("request", default={})  # headers of the current /mcp call


      def tool(name, description, props=None, required=()):
          def deco(fn):
              schema = {"type": "object", "properties": props or {}, "required": list(required)}
              TOOLS[name] = ({"name": name, "description": description, "inputSchema": schema}, fn)
              return fn
          return deco


      def up_addr():
          try:
              return socket.gethostbyname(UP_HOST)
          except OSError:
              return UP_HOST


      def http(method, path, body=None, headers=None, timeout=60):
          url = "http://%s:%d%s" % (up_addr(), UP_PORT, path)
          req = urllib.request.Request(url, data=body, method=method, headers=headers or {})
          with urllib.request.urlopen(req, timeout=timeout) as r:
              return r.status, r.read()


      def err(i, code, message):
          return {"jsonrpc": "2.0", "id": i, "error": {"code": code, "message": message}}


      def rpc(msg):
          m, i, p = msg.get("method"), msg.get("id"), msg.get("params") or {}
          if m == "initialize":
              r = {"protocolVersion": p.get("protocolVersion", "2025-06-18"), "capabilities": {"tools": {}},
                   "serverInfo": {"name": APP, "version": VERSION}}
          elif m == "tools/list":
              r = {"tools": [t[0] for t in TOOLS.values()]}
          elif m == "tools/call":
              name, args = p.get("name"), p.get("arguments") or {}
              if name not in TOOLS:
                  return err(i, -32602, "unknown tool %s" % name)
              try:
                  out = TOOLS[name][1](**args)
                  if isinstance(out, dict) and "_content" in out:
                      r = {"content": out["_content"]}
                  else:
                      text = out if isinstance(out, str) else json.dumps(out, indent=2)
                      r = {"content": [{"type": "text", "text": text[:200000]}]}
              except Exception as e:  # tool errors go back to the agent, not the transport
                  r = {"content": [{"type": "text", "text": "%s: %s" % (type(e).__name__, e)}], "isError": True}
          elif m == "ping":
              r = {}
          elif i is None:
              return None  # notification
          else:
              return err(i, -32601, "unknown method %s" % m)
          return {"jsonrpc": "2.0", "id": i, "result": r}


      REASONS = {200: "OK", 202: "Accepted", 400: "Bad Request", 404: "Not Found", 405: "Method Not Allowed",
                 401: "Unauthorized", 413: "Payload Too Large", 502: "Bad Gateway"}


      async def respond(writer, code, obj=None, extra=""):
          body = b"" if obj is None else json.dumps(obj).encode()
          head = "HTTP/1.1 %d %s\r\nContent-Type: application/json\r\nContent-Length: %d\r\nConnection: close\r\n%s\r\n" % (
              code, REASONS.get(code, "OK"), len(body), extra)
          writer.write(head.encode() + body)
          try:
              await writer.drain()
          finally:
              writer.close()


      async def mcp(reader, writer, method, rest):
          headers = {}
          for line in rest.decode("latin-1").split("\r\n"):
              if ":" in line:
                  k, v = line.split(":", 1)
                  headers[k.strip().lower()] = v.strip()
          if MCP_TOKEN:
              import hmac
              if not hmac.compare_digest(headers.get("authorization", "").encode(), ("Bearer " + MCP_TOKEN).encode()):
                  return await respond(writer, 401, {"error": "this MCP needs Authorization: Bearer <token>"}, 'WWW-Authenticate: Bearer\r\n')
          if method != "POST":
              return await respond(writer, 405, {"error": "use POST %s" % MCP_PATH}, "Allow: POST\r\n")
          n = int(headers.get("content-length") or 0)
          if n > MAX_BODY:
              return await respond(writer, 413, {"error": "request too large"})
          body = await reader.readexactly(n) if n else b""
          try:
              msg = json.loads(body or b"{}")
          except ValueError:
              return await respond(writer, 400, err(None, -32700, "parse error"))
          REQUEST.set(headers)
          batch = msg if isinstance(msg, list) else [msg]
          results = await asyncio.gather(*(asyncio.to_thread(rpc, x) for x in batch if isinstance(x, dict)))
          out = [x for x in results if x]
          if not out:
              return await respond(writer, 202)
          await respond(writer, 200, out if isinstance(msg, list) else out[0])


      async def pipe(r, w):
          try:
              while True:
                  data = await r.read(65536)
                  if not data:
                      break
                  w.write(data)
                  await w.drain()
          except (ConnectionError, OSError):
              pass
          finally:
              try:
                  w.close()
              except Exception:
                  pass


      async def handle(reader, writer):
          try:
              head = await reader.readuntil(b"\r\n\r\n")
          except (asyncio.IncompleteReadError, asyncio.LimitOverrunError, ConnectionError):
              writer.close()
              return
          line, _, rest = head.partition(b"\r\n")
          parts = line.decode("latin-1").split(" ")
          path = parts[1].split("?", 1)[0] if len(parts) >= 3 else ""
          if path == MCP_PATH:
              return await mcp(reader, writer, parts[0], rest)
          if not UP_HOST:
              return await respond(writer, 404, {"error": "not found"})
          try:
              ur, uw = await asyncio.open_connection(UP_HOST, UP_PORT)
          except OSError:
              return await respond(writer, 502, {"error": "%s is starting or not reachable" % APP})
          # One request per proxied connection (unless it is an upgrade such as a WebSocket), so a
          # later /mcp request can never ride an upstream keep-alive connection.
          lines = head.decode("latin-1").split("\r\n")
          if not any(l.lower().startswith("upgrade:") for l in lines):
              lines = [l for l in lines if l and not l.lower().startswith(("connection:", "keep-alive:"))]
              head = ("\r\n".join(lines) + "\r\nConnection: close\r\n\r\n").encode("latin-1")
          uw.write(head)
          await uw.drain()
          await asyncio.gather(pipe(reader, uw), pipe(ur, writer))


      async def main():
          srv = await asyncio.start_server(handle, "0.0.0.0", PORT, limit=MAX_HEAD)
          async with srv:
              await srv.serve_forever()


      # ---- tools for this app ----
      # Files tools: work directly in the shared Files folder (the same folder File Browser shows).
      # Every path is relative to that folder. Nothing outside it can be reached, hidden (dot) files are
      # off limits like in File Browser, and there is no delete: removing things stays a human action.

      ROOT = os.path.realpath(os.environ.get("FILES_ROOT", "/srv"))
      MAX_READ = 1 << 20       # text returned per read
      MAX_WRITE = 1 << 20      # text accepted per write
      MAX_LIST = 500
      MAX_SCAN = 20000         # entries visited per search
      os.umask(0o002)          # same sharing as File Browser (files 0664, folders 0775)


      def _box_only():
          """Files tools answer only to apps on this box (e.g. the agent through the Wizard hub), never to a request
          that came in through Tailscale Serve, a tunnel or the App Manager's proxy: those reach File Browser itself,
          behind its own login when one is set."""
          h = REQUEST.get()
          if any(h.get(k) for k in ("tailscale-user-login", "x-forwarded-for", "forwarded", "cf-connecting-ip",
                                    "cf-access-jwt-assertion", "x-real-ip")):
              raise PermissionError("the Files tools are only for apps on this box")


      def _safe(path, must_exist=True):
          _box_only()
          rel = str(path or "").strip().replace("\\", "/")
          parts = [p for p in rel.split("/") if p not in ("", ".")]
          if any(p == ".." or p.startswith(".") for p in parts):
              raise ValueError("paths stay inside Files and can't name hidden files")
          full = os.path.realpath(os.path.join(ROOT, *parts))
          if full != ROOT and not full.startswith(ROOT + os.sep):
              raise ValueError("that path leads outside the Files folder")
          if must_exist and not os.path.exists(full):
              raise FileNotFoundError("nothing at '%s' in Files" % "/".join(parts))
          return full, "/".join(parts)


      def _entry(full, rel):
          st = os.stat(full)
          is_dir = os.path.isdir(full)
          out = {"path": rel or "/", "name": os.path.basename(full) if rel else "Files",
                 "type": "folder" if is_dir else "file",
                 "modified": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime(st.st_mtime))}
          if not is_dir:
              out["size"] = st.st_size
          return out


      @tool("files_list", "List a folder in the owner's Files (the shared folder every app uses). "
            "Paths are relative to Files, e.g. '' for the top, 'Videos' or 'Documents/Taxes'.",
            {"path": {"type": "string", "description": "Folder inside Files; empty for the top"},
             "limit": {"type": "integer", "description": "Max entries, default 200, up to 500"}})
      def files_list(path="", limit=200):
          full, rel = _safe(path)
          if not os.path.isdir(full):
              raise NotADirectoryError("'%s' is a file, not a folder" % rel)
          names = sorted((n for n in os.listdir(full) if not n.startswith(".")), key=str.lower)
          cap = max(1, min(int(limit or 200), MAX_LIST))
          items = []
          for n in names[:cap]:
              try:
                  items.append(_entry(os.path.join(full, n), (rel + "/" + n) if rel else n))
              except OSError:
                  continue
          return {"folder": rel or "/", "count": len(names), "shown": len(items), "items": items}


      @tool("files_find", "Find files or folders in Files whose name contains some text (not case sensitive).",
            {"query": {"type": "string", "description": "Part of the name, e.g. 'invoice' or '.mp4'"},
             "path": {"type": "string", "description": "Folder to search in; empty for all of Files"},
             "limit": {"type": "integer", "description": "Max results, default 50"}},
            ["query"])
      def files_find(query, path="", limit=50):
          q = str(query or "").strip().lower()
          if not q:
              raise ValueError("say what to look for")
          full, rel = _safe(path)
          cap = max(1, min(int(limit or 50), MAX_LIST))
          found, seen = [], 0
          for top, dirs, files in os.walk(full):
              dirs[:] = sorted(d for d in dirs if not d.startswith("."))
              base = os.path.relpath(top, ROOT)
              base = "" if base == "." else base.replace(os.sep, "/")
              for n in dirs + sorted(f for f in files if not f.startswith(".")):
                  seen += 1
                  if q in n.lower():
                      try:
                          found.append(_entry(os.path.join(top, n), (base + "/" + n) if base else n))
                      except OSError:
                          pass
                      if len(found) >= cap:
                          return {"query": q, "results": found, "complete": False}
                  if seen >= MAX_SCAN:
                      return {"query": q, "results": found, "complete": False}
          return {"query": q, "results": found, "complete": True}


      @tool("files_read", "Read a text file from Files (notes, markdown, CSV, JSON, subtitles...). "
            "Binary files such as videos or PDFs are described, not returned.",
            {"path": {"type": "string", "description": "File inside Files, e.g. 'Documents/notes.md'"}},
            ["path"])
      def files_read(path):
          full, rel = _safe(path)
          if os.path.isdir(full):
              raise IsADirectoryError("'%s' is a folder; use files_list" % rel)
          info = _entry(full, rel)
          with open(full, "rb") as fh:
              data = fh.read(MAX_READ + 1)
          if b"\x00" in data[:8192]:
              info["text"] = None
              info["note"] = "binary file; pass its path to the app that handles it, or open it in the Files app"
              return info
          try:
              text = data[:MAX_READ].decode("utf-8")
          except UnicodeDecodeError:
              text = data[:MAX_READ].decode("utf-8", "replace")
          info["text"] = text
          info["truncated"] = len(data) > MAX_READ
          return info


      @tool("files_write", "Save a text file in Files so the owner can open it in the Files app. "
            "Won't replace an existing file unless overwrite is true. Never deletes anything.",
            {"path": {"type": "string", "description": "Where to save, e.g. 'Documents/summary.md'"},
             "text": {"type": "string", "description": "The file's full text"},
             "overwrite": {"type": "boolean", "description": "Replace the file if it already exists (default false)"},
             "make_folders": {"type": "boolean", "description": "Create missing folders on the way (default true)"}},
            ["path", "text"])
      def files_write(path, text, overwrite=False, make_folders=True):
          full, rel = _safe(path, must_exist=False)
          if not rel:
              raise ValueError("give a file name")
          body = str(text if text is not None else "").encode("utf-8")
          if len(body) > MAX_WRITE:
              raise ValueError("text is over 1 MB; split it into several files")
          if os.path.isdir(full):
              raise IsADirectoryError("'%s' is a folder" % rel)
          if os.path.exists(full) and not overwrite:
              raise FileExistsError("'%s' already exists; set overwrite to replace it" % rel)
          parent = os.path.dirname(full)
          if not os.path.isdir(parent):
              if not make_folders:
                  raise FileNotFoundError("folder for '%s' doesn't exist" % rel)
              _safe(os.path.relpath(parent, ROOT), must_exist=False)
              os.makedirs(parent, mode=0o775, exist_ok=True)
          tmp = os.path.join(parent, ".files-write-%d.tmp" % os.getpid())
          with open(tmp, "wb") as fh:
              fh.write(body)
          os.replace(tmp, full)
          return {"saved": _entry(full, rel)}


      @tool("files_new_folder", "Create a folder in Files (and any missing folders above it).",
            {"path": {"type": "string", "description": "e.g. 'Documents/Receipts/2026'"}}, ["path"])
      def files_new_folder(path):
          full, rel = _safe(path, must_exist=False)
          if not rel:
              raise ValueError("give a folder name")
          if os.path.exists(full) and not os.path.isdir(full):
              raise FileExistsError("'%s' is a file" % rel)
          os.makedirs(full, mode=0o775, exist_ok=True)
          return {"folder": _entry(full, rel)}


      if __name__ == "__main__":
          asyncio.run(main())
    # END MCP FRONT
    x-runtipi:
      is_main: true
      internal_port: 8080
  files-engine:
    # Unmodified official File Browser (Apache-2.0), pinned by digest.
    image: filebrowser/filebrowser:v2.63.23@sha256:a469ea076d4a1b4b1d86a41d130f2f536cd9da996a2b1fb39c0d7635f9d89b9a
    # Starts as root only to make Runtipi's shared media folder usable by uid-1000 apps (Runtipi creates it
    # root:root 0755), then drops to uid 1000 (the image's "user") before File Browser runs.
    user: "0:0"
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 1024
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m", "/config:rw,noexec,nosuid,size=1m"]
    environment:
      FILES_PASSWORD: ${FILES_PASSWORD}
      # Also read by the image's own healthcheck (/healthcheck.sh).
      FB_ADDRESS: 0.0.0.0
      FB_PORT: "8080"
      # Runtime override also migrates existing databases without changing user data.
      FB_BASEURL: /files
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/files/health"]
    entrypoint:
      - tini
      - --
      - /bin/sh
      - -c
      - |
        set -eu
        umask 0002  # honor File Browser's fileMode 0664 / dirMode 0775 so every uid-1000 app shares the folders
        DB=/database/filebrowser.db
        # This folder only, never recursive: existing contents keep their owners and modes.
        if [ "$$(stat -c %u /srv)" = 0 ]; then chmod 0775 /srv; chown 1000:1000 /srv; fi
        if [ "$$(stat -c %u /database)" = 0 ]; then chown 1000:1000 /database; fi
        setuidgid user sh -c 'for d in Videos Videos/Edited Documents; do
          [ -e "/srv/$$d" ] || [ -L "/srv/$$d" ] || mkdir -m 0775 "/srv/$$d" || echo "files: could not create $$d (folder not writable)"
        done'
        fb() { setuidgid user filebrowser -d "$$DB" "$$@" >/dev/null; }
        if [ ! -f "$$DB" ]; then
          fb config init --root /srv --address 0.0.0.0 --port 8080 --branding.name Files \
            --fileMode 0o664 --dirMode 0o775 --hideDotfiles --tus.chunkSize 10485760 --tus.retryCount 10 --auth.method noauth
          fb users add admin "$$(head -c 32 /dev/urandom | base64)" --scope . --hideDotfiles \
            --perm.admin=false --perm.execute=false --perm.create --perm.delete --perm.download --perm.modify --perm.rename --perm.share
        fi
        if [ -n "$${FILES_PASSWORD:-}" ]; then
          fb users update admin --password "$$FILES_PASSWORD" || { echo "files: the password must be at least 12 characters"; exit 1; }
          fb config set --auth.method json
          echo "files: login on (user admin)"
        else
          fb config set --auth.method noauth
          echo "files: no login (private network only)"
        fi
        exec setuidgid user filebrowser -d "$$DB"
    volumes:
      # Runtipi's standard shared folder (runtipi/media): the only browsable root.
      - ${ROOT_FOLDER_HOST}/media:/srv
      - ${APP_DATA_DIR}/data/db:/database
x-runtipi:
  schema_version: 2
  overrides: []
